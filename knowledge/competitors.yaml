# Mitbewerber-Knowledgebase für den Webapp-Reiter "Neukundenakquise"
# (logic/competitor_detection.py, logic/competitor_comparison.py).
#
# Zentrale, erweiterbare Struktur (siehe Auftrag): neue Mitbewerber oder neue
# technische Fingerprints werden ausschließlich HIER ergänzt - niemals im
# Code hartcodiert. logic/competitor_detection.py kennt keine Anbieternamen
# oder Domains, sondern liest ausschließlich diese Datei.
#
# AUFBAU pro Anbieter:
#   name                 - Anzeigename
#   typ                  - fachliche Kategorie (PMS | IBE | Channelmanager |
#                           "IBE + Channelmanager" | All-In-One)
#   fokus_staerken       - kurze, neutrale Beschreibung (keine Werturteile,
#                           siehe Auftrag "Mitbewerber != schlechter")
#   kundentypen          - "typischer Kunde" - NUR für Vertriebsverständnis/
#                           Gesprächsvorbereitung, NIEMALS als technischer
#                           Erkennungsbeweis verwendet (siehe Auftrag)
#   anbieter_domain      - Haupt-/Produktdomain des Anbieters (Information,
#                           kein alleiniges Erkennungsmerkmal)
#   dirs21_coexistence   - ja | nein | nicht bestätigt | intern pruefen
#                           ("nicht auf öffentlicher Partnerliste gefunden"
#                           ist NICHT gleich "existiert technisch nicht" -
#                           siehe Auftrag Abschnitt 16)
#   sales_relevance      - { focus_competitor: true|false } - markiert
#                           Anbieter, die im Vertrieb besonders häufig
#                           relevant sind (siehe Auftrag "Neukunden"
#                           Abschnitt 19/28). Darf den Neukunden-Score nur
#                           MODERAT positiv beeinflussen (siehe
#                           logic/scoring_neukunden.py) - niemals allein
#                           Priorität A erzeugen.
#   capabilities         - Capability-Matrix je DIRS21-Vergleichsdimension,
#                           NUR kontrollierte Werte (yes|partial|no|unknown je
#                           status, siehe Auftrag "Competitive Gap Analysis").
#                           Nur fachlich bestätigte Informationen hinterlegt;
#                           alles andere bleibt bewusst "unknown" statt
#                           geraten (siehe Modul-Docstring
#                           logic/competitor_comparison.py für die genaue
#                           Herkunft jedes Werts).
#   fingerprints         - Liste technischer Erkennungsregeln (siehe unten)
#   pruefhinweise        - Hinweise zur Einordnung/Unsicherheiten
#   quellen              - Herkunft der hinterlegten Informationen
#
# FINGERPRINT-REGEL-FELDER:
#   system         - ibe | pms | channel_manager (siehe Auftrag Abschnitt 5:
#                    technisch ist über die öffentliche Website nur die
#                    Booking Engine (IBE) direkt nachweisbar - für PMS und
#                    Channelmanager gibt es aktuell KEINE öffentlich
#                    sichtbaren technischen Fingerprints, siehe
#                    logic/competitor_detection.py-Moduldokumentation)
#   signal         - domain | query_params | keyword
#   pattern        - bei domain/keyword: ein einzelner String (Teilstring-
#                    Suche, klein geschrieben); bei query_params: eine Liste
#                    von Query-Parameter-Namen
#   min_matches    - nur bei query_params: Mindestanzahl gleichzeitig
#                    gefundener Parameter (siehe Seekda - Auftrag Abschnitt
#                    14, mehrere eindeutige skd-* Parameter nötig)
#   evidence_score - 0-100 (siehe Auftrag Abschnitt 12 "Erkennungssicherheit")
#   hinweis        - optionaler Erkennungsgrund-Text für die Detailansicht

providers:
  hotelnetsolutions:
    name: "HotelNetSolutions"
    typ: "IBE + Channelmanager"
    fokus_staerken: "Channelmanagement und Buchungsengine (OnePageBooking) für unabhängige Hotels"
    kundentypen: "Kleinere bis mittlere unabhängige Hotels"
    anbieter_domain: "onepagebooking.com"
    dirs21_coexistence: "nicht bestätigt"
    sales_relevance:
      focus_competitor: true
    capabilities:
      booking_engine: {status: "yes"}
      channel_manager: {status: "yes"}
      pms: {status: "no"}
      voucher_shop: {status: "unknown"}
      bookable_extras: {status: "unknown"}
      mice: {status: "unknown"}
      event_assistant: {status: "unknown"}
      insights_reporting: {status: "unknown"}
    fingerprints:
      - {system: ibe, signal: domain, pattern: "onepagebooking.com", evidence_score: 100,
         hinweis: "onepagebooking.com im Buchungslink/iframe gefunden - sehr starkes Produktmerkmal von HotelNetSolutions."}
      - {system: ibe, signal: keyword, pattern: "onepagebooking", evidence_score: 60}
      - {system: ibe, signal: keyword, pattern: "hotelnetsolutions", evidence_score: 60}
      - {system: ibe, signal: keyword, pattern: "hns", evidence_score: 20,
         hinweis: "'HNS' ist ein sehr generisches Kürzel - allein kein starker Nachweis."}
    pruefhinweise: "OnePageBooking ist das entscheidende Produktmerkmal; die reine Textnennung von 'HNS' allein reicht nicht."
    quellen: "DIRS21 Sales Intelligence - Mitbewerber-Knowledgebase (Auftrag)"

