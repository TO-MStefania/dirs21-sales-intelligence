    pruefhinweise: "Domain allein ist bei Seekda KEIN verlässliches Merkmal (kundeneigene Booking-Subdomain möglich) - die skd-* Parameter sind der entscheidende Nachweis."
    quellen: "DIRS21 Sales Intelligence - Mitbewerber-Knowledgebase (Auftrag)"
