# DIRS21 Sales Intelligence - Konfiguration
#
# Wird sowohl vom lokalen CLI-Tool (analyze.py, Excel-Import) als auch von
# der optionalen Streamlit-Webapp (app.py, HubSpot-API) genutzt. Passe diese
# Datei an deine Datenquelle an, ohne Code ändern zu müssen.

excel:
  # Name des Tabellenblatts mit den Sales-Intelligence-Daten (siehe Auftrag
  # "eine Excel-Datei, mehrere Tabellenblätter"). Optional: existiert kein
  # Blatt mit diesem Namen (z.B. bei einer einfachen, einblättrigen
  # Bestandsdatei), wird automatisch das erste Tabellenblatt verwendet - das
  # bleibt vollständig rückwärtskompatibel.
  sheet_name: "Sales Intelligence"
  # Mapping: fachlicher (interner) Name -> tatsächliche Spaltenüberschrift
  # in deinem HubSpot-Excel-Export. Die exakten Spaltennamen können sich je
  # nach Export unterscheiden - hier anpassen, nicht im Code.
  columns:
    hotel_name: Unternehmensname
    website: Unternehmensdomain
    ort: Ort
    # optional - vorhandener Excel-Wert hat immer Vorrang vor jeder Recherche
    # (siehe logic/room_count_detection.py). Leer bleibt leer -> dann wird
    # zuerst die Website, danach ggf. sparsam eine Websuche geprüft.
    zimmeranzahl: Zimmeranzahl
    adressgruppe: Adressgruppe
    dirs21_id: DIRS21-ID
    # optional - falls in deinem Export nicht vorhanden, bleibt das Feld leer
    record_id: Record ID
    # optional - werden NICHT in die Sales-Intelligence-Auswertung/den Export
    # übernommen (siehe logic/pipeline.py, RESULT_COLUMNS bleibt unverändert),
    # sondern ausschließlich für die Adress-Vorbefüllung im Reiter
    # "Routenplanung" verwendet, falls vorhanden (siehe Auftrag). Fehlen diese
    # Spalten im Export, bleiben sie leer - der Nutzer ergänzt die Adresse
    # dann manuell beim Anlegen eines Termins.
    strasse: Straße
    plz: PLZ

hubspot:
  # Mapping: fachlicher (interner) Name -> tatsächlicher HubSpot-Property-Name
  # der Company-Objekte in deinem Account. Wird nur von der optionalen
  # Streamlit-Webapp (app.py) verwendet.
  #
  # WICHTIG: "adressgruppe" und "dirs21_id" sind Platzhalter-Property-Namen.
  # Trage hier die echten internen Property-Namen aus deinem HubSpot-Account ein
  # (zu finden in HubSpot unter Einstellungen -> Eigenschaften -> Unternehmen).
  properties:
    hotel_name: name
    website: domain
    ort: city
    adressgruppe: adressgruppe
    dirs21_id: dirs21_id

# Bildet die rohen Adressgruppen-Werte (aus Excel oder HubSpot) auf die
# kanonischen Kategorien der Vertriebslogik ab. Passe die rechte Seite an,
# falls dein Export/HubSpot-Dropdown andere Beschriftungen verwendet.
adressgruppe_mapping:
  kunde:
    - "Kunde"
  neukunde:
    - "Neukunde"
  akquise:
    - "Akquise"
  ehemaliger_kunde:
    - "ehemaliger Kunde"
    - "Ehemaliger Kunde"
  interessent:
    - "Interessent"

dirs21_signatures:
  # Zentrale, verifizierte DIRS21/TourOnline-Kennzeichen für die technische
  # Produkterkennung (logic/dirs21_detection.py). Ein DIRS21-Produkt gilt nur
  # als erkannt, wenn eines dieser Kennzeichen technisch eingebettet ist
  # (iFrame-/Script-Quelle oder Buchungslink-Ziel) - eine bloße Erwähnung im
  # sichtbaren Text reicht nicht aus. Bitte nur echte, verifizierte
  # Kennzeichen eintragen, keine vermuteten/erfundenen Muster.
  keywords:
    - "dirs21"
    - "touronline ag"
    - "touronline"

analysis:
  # Standardwert für "Max. Anzahl Hotels analysieren" in der Streamlit-App.
  max_hotels_default: 10
  # Timeout in Sekunden für HTTP-Requests beim Website-Crawling.
  request_timeout_seconds: 10
  # Maximale Anzahl Unterseiten pro Website, die zusätzlich zur Startseite
  # gecrawlt werden (Buchung, Gutschein, Tagung, Event, Datenschutz, ...).
  max_pages_per_website: 8
  # analyze.py: nach wie vielen Unternehmen ein Zwischenstand der
  # Ergebnis-Excel gespeichert wird.
  save_interval: 5

# Routenplanung (eigener Webapp-Reiter, siehe logic/route_planner.py).
# Termine werden primär DIREKT IN DER WEBAPP angelegt (siehe Auftrag) und nur
# für die laufende Session im Streamlit Session State gehalten - ein
# Tabellenblatt "Routenplanung" in der hochgeladenen Excel-Datei ist
# OPTIONAL und wird nur importiert, falls vorhanden. Die
# Sales-Intelligence-Logik (Scoring, Produkterkennung, CRM-Status, Export)
# bleibt davon vollständig unberührt.
routenplanung:
  excel:
    # Name des optionalen Eingabe-Tabellenblatts mit bereits vorhandenen
    # Terminen. Fehlt dieses Blatt, wird nichts importiert - kein Fehler,
    # Termine können vollständig in der Webapp angelegt werden.
    sheet_name: "Routenplanung"
    # Mapping: fachlicher (interner) Name -> Spaltenüberschrift im
    # Routenplanung-Tabellenblatt (gilt für Import UND Export).
    columns:
      hotel_name: Unternehmensname
      dirs21_id: DIRS21-ID
      strasse: Straße
      plz: PLZ
      ort: Ort
      termin_datum: Termin_Datum
      termin_uhrzeit: Termin_Uhrzeit
      termin_bis: Termin_bis
      termin_status: Termin_Status
      flexibel_von: Flexibel_von
      flexibel_bis: Flexibel_bis
      termin_dauer_minuten: Termin_Dauer_Minuten
      prioritaet: Gesamtpriorität
      fachliche_top_empfehlung: Fachliche_Top_Empfehlung
      bemerkung: Bemerkung
  # Name des beim Export zusätzlich erzeugten Ergebnis-Tabellenblatts (siehe
  # logic/exporter.py -> export_workbook_bytes). Das Eingabeblatt
  # "Routenplanung" wird dabei nie überschrieben.
  ergebnis_sheet_name: "Routen-Ergebnis"
  # Zentral konfigurierbarer Standardwert für Termin_Dauer_Minuten, falls in
  # der Excel-Zeile nicht angegeben (siehe Auftrag Abschnitt 5).
  standard_termin_dauer_minuten: 60
  # Zentral konfigurierbarer Sicherheits-/Parkpuffer in Minuten, der bei der
  # Machbarkeitsprüfung zwischen zwei Terminen zusätzlich zur reinen Fahrzeit
  # berücksichtigt wird (siehe Auftrag Abschnitt 11) - bewusst nur hier
  # definiert, nicht an mehreren Stellen im Code verteilt.
  fahrzeitpuffer_minuten: 15
  # "Passende Unternehmen entlang der Route" (siehe Auftrag Abschnitt 20):
  # maximale Abweichung (Luftlinie, km) zu einem Tourstopp, damit ein
  # Unternehmen überhaupt als Vorschlag infrage kommt.
  max_abweichung_km_fuer_vorschlaege: 15
  # Maximale Anzahl Vorschläge, die im Reiter angezeigt werden.
  max_vorschlaege: 10
