# DIRS21 Sales Intelligence - Konfiguration
#
# Wird sowohl vom lokalen CLI-Tool (analyze.py, Excel-Import) als auch von
# der optionalen Streamlit-Webapp (app.py, HubSpot-API) genutzt. Passe diese
# Datei an deine Datenquelle an, ohne Code ändern zu müssen.

excel:
  # Mapping: fachlicher (interner) Name -> tatsächliche Spaltenüberschrift
  # in deinem HubSpot-Excel-Export. Die exakten Spaltennamen können sich je
  # nach Export unterscheiden - hier anpassen, nicht im Code.
  columns:
    hotel_name: Unternehmensname
    website: Unternehmensdomain
    ort: Ort
    # optional - vorhandener Excel-Wert hat immer Vorrang vor jeder Recherche
    # (siehe logic/room_count_detection.py). Leer bleibt leer -> dann wird
    # zuerst die Website, danach ggf. sparsam eine Websuche geprüft.
    zimmeranzahl: Zimmeranzahl
    adressgruppe: Adressgruppe
    dirs21_id: DIRS21-ID
    # optional - falls in deinem Export nicht vorhanden, bleibt das Feld leer
    record_id: Record ID

hubspot:
  # Mapping: fachlicher (interner) Name -> tatsächlicher HubSpot-Property-Name
  # der Company-Objekte in deinem Account. Wird nur von der optionalen
  # Streamlit-Webapp (app.py) verwendet.
  #
  # WICHTIG: "adressgruppe" und "dirs21_id" sind Platzhalter-Property-Namen.
  # Trage hier die echten internen Property-Namen aus deinem HubSpot-Account ein
  # (zu finden in HubSpot unter Einstellungen -> Eigenschaften -> Unternehmen).
  properties:
    hotel_name: name
    website: domain
    ort: city
    adressgruppe: adressgruppe
    dirs21_id: dirs21_id

# Bildet die rohen Adressgruppen-Werte (aus Excel oder HubSpot) auf die
# kanonischen Kategorien der Vertriebslogik ab. Passe die rechte Seite an,
# falls dein Export/HubSpot-Dropdown andere Beschriftungen verwendet.
adressgruppe_mapping:
  kunde:
    - "Kunde"
  neukunde:
    - "Neukunde"
  akquise:
    - "Akquise"
  ehemaliger_kunde:
    - "ehemaliger Kunde"
    - "Ehemaliger Kunde"
  interessent:
    - "Interessent"

dirs21_signatures:
  # Zentrale, verifizierte DIRS21/TourOnline-Kennzeichen für die technische
  # Produkterkennung (logic/dirs21_detection.py). Ein DIRS21-Produkt gilt nur
  # als erkannt, wenn eines dieser Kennzeichen technisch eingebettet ist
  # (iFrame-/Script-Quelle oder Buchungslink-Ziel) - eine bloße Erwähnung im
  # sichtbaren Text reicht nicht aus. Bitte nur echte, verifizierte
  # Kennzeichen eintragen, keine vermuteten/erfundenen Muster.
  keywords:
    - "dirs21"
    - "touronline ag"
    - "touronline"

analysis:
  # Standardwert für "Max. Anzahl Hotels analysieren" in der Streamlit-App.
  max_hotels_default: 10
  # Timeout in Sekunden für HTTP-Requests beim Website-Crawling.
  request_timeout_seconds: 10
  # Maximale Anzahl Unterseiten pro Website, die zusätzlich zur Startseite
  # gecrawlt werden (Buchung, Gutschein, Tagung, Event, Datenschutz, ...).
  max_pages_per_website: 8
  # analyze.py: nach wie vielen Unternehmen ein Zwischenstand der
  # Ergebnis-Excel gespeichert wird.
  save_interval: 5
